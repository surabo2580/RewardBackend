services:
  postgres:
    image: postgres:16-alpine
    container_name: reward-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reward_db}
      POSTGRES_USER: ${POSTGRES_USER:-surajdas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surajdas}
    ports:
      - "5432:5432"
    volumes:
      - reward_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surajdas} -d ${POSTGRES_DB:-reward_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: reward-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@reward.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  reward_postgres_data:
